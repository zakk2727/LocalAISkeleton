version = 0.1.0

# Global Router Defaults (Inherited by all models unless overridden)
[*]
host = 0.0.0.0
port = 8080
ctx-size = 98304          # Target context window 
cache-type-k = q8_0          # 8-bit Key Cache compression (saves VRAM)
cache-type-v = q8_0          # 8-bit Value Cache compression
flash-attn = on
batch-size = 4096
ubatch-size = 512
n-gpu-layers = 99
mmproj = /models/mmproj-gemma-4-12B-it-bf16.gguf
kv-unified = false
