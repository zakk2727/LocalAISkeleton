version = 0.1.0

# Global Router Defaults (Inherited by all models unless overridden)
[*]
host = 0.0.0.0
port = 8080
ctx-size = 98304          # Target context window 
cache-type-k = q8_0          # 8-bit Key Cache compression (saves VRAM)
cache-type-v = q8_0          # 8-bit Value Cache compression
flash-attn = on
batch-size = 4096
ubatch-size = 512
n-gpu-layers = 99
kv-unified = false

# 1. Primary Orchestrator (Large Context + Multimodal)
[Main-Multimodal-Model]
model = /models/<model>.gguf
mmproj = /models/mmproj-<model>.gguf
model-draft = /models/mtp-<model>.gguf
spec-type = draft-mtp
spec-draft-n-max = 4
ctx-size = 98304
parallel = 2

# 2. Heavy Worker Sub-Agent (Ingestion, JSON Extraction, Log Parsing)
[Heavy Model]
model = /models/<model>.gguf
ctx-size = 32768
parallel = 4
temp = 0.2

# 3. Fast Triage & Web Scraper Sub-Agent (Routing, Query Expansion, Unfiltered Filter)
[Fast Model]
model = /models/<model>.gguf
ctx-size = 16384
parallel = 4
temp = 0.3
